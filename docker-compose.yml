# Each block under services: defines one container to run.
# command param overrides the CMD in Dockerfile
# All on the same internal network → so coordinator can reach them via
# http://node1:8001, http://node2:8002, etc.

version: "3.9"
services:
  node1:
    build: .
    container_name: node1
    ports:
      - "8001:8001"
    command: ["uvicorn", "cache_logic.server:app", "--host", "0.0.0.0", "--port", "8001"]
  node2:
    build: .
    container_name: node2
    ports:
      - "8002:8002"
    command: ["uvicorn", "cache_logic.server:app", "--host", "0.0.0.0", "--port", "8002"]

  node3:
    build: .
    container_name: node3
    ports:
      - "8003:8003"
    command: ["uvicorn", "cache_logic.server:app", "--host", "0.0.0.0", "--port", "8003"]

  coordinator:
    build: .
    container_name: coordinator
    ports:
      - "8000:8000"
    command: ["uvicorn", "coordinator:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - node1
      - node2
      - node3